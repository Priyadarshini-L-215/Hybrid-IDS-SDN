detection:
  anomaly_min_samples: 10
  correlation_window: 10.0
  decision_engine:
    thresholds:
      attack: 0.65
      suspicious: 0.35
      anomaly: 0.6
    weights:
      signature: 1.0
      ml: 0.8
      anomaly: 0.2
  dos_threshold: 100
  ml:
    active_model: model_v4.pkl
    active_scaler: scaler_v4.pkl
    ml_threshold: 0.153
    vae_threshold: 0.3
  port_scan_threshold: 25
mitigation:
  block_ttl: 300
  rate_limit_per_sec: 5
  reputation_limit: 10.0
  reputation_perm_block: 50.0
  reputation_temp_block: 25.0
network:
  api_port: 5000
  redis_host: 127.0.0.1
  redis_port: 6379
  ui_port: 3000
system:
  batch_flush_interval: 0.25
  batch_size: 5
  log_level: INFO
  use_json_logging: false
  worker_count: 4
