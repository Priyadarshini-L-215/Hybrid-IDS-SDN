detection:
  anomaly_min_samples: 10
  correlation_window: 10.0
  decision_engine:
    thresholds:
      attack: 0.85
      suspicious: 0.6
      anomaly: 0.6
    weights:
      signature: 1.0
      ml: 0.9
      anomaly: 0.1
  dos_threshold: 100
  ml:
    active_model: rf_multi_pipeline.onnx
    active_scaler: scaler_multi.pkl
  port_scan_threshold: 25
mitigation:
  block_ttl: 300
  rate_limit_per_sec: 5
  reputation_limit: 10.0
  reputation_perm_block: 50.0
  reputation_temp_block: 25.0
network:
  api_port: 3000
  redis_host: 127.0.0.1
  redis_port: 6379
system:
  batch_flush_interval: 0.25
  batch_size: 20
  log_level: INFO
  use_json_logging: false
  worker_count: 8
forensics:
  pcap_enabled: true
