detection:
  anomaly_min_samples: 10
  autoencoder_threshold: 0.04
  correlation_window: 10.0
  decision_engine:
    thresholds:
      anomaly: 0.8
      attack: 0.95
      suspicious: 0.85
    weights:
      anomaly: 0.3
      ml: 0.7
      signature: 1.0
  dos_threshold: 100
  ml:
    active_model: Encrypted_C2_Model_V2.pkl
    active_scaler: none
  port_scan_threshold: 25
forensics:
  pcap_enabled: true
mitigation:
  block_ttl: 300
  ebpf_enabled: false
  ebpf_interface: eth0
  quarantine_vlan_id: 99
  rate_limit_per_sec: 5
  reputation_limit: 10.0
  reputation_perm_block: 50.0
  reputation_temp_block: 25.0
network:
  api_port: 3000
  redis_host: 127.0.0.1
  redis_port: 6379
system:
  batch_flush_interval: 0.25
  batch_size: 20
  log_level: INFO
  use_json_logging: false
  worker_count: 8
