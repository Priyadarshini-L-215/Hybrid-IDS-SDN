<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI IDS Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f9; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0px 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #007bff; color: white; }
        .attack { background-color: #ffcccc; color: #900; font-weight: bold; }
        .normal { background-color: #ccffcc; color: #090; }
        #last-updated { color: #555; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h1>Suricata AI-IDS Dashboard</h1>
    <p>Last Refresh: <span id="last-updated">Waiting...</span></p>

    <table>
        <thead>
            <tr>
                <th>Timestamp</th>
                <th>Source IP</th>
                <th>Destination IP</th>
                <th>Dest Port</th>
                <th>Signature / Type</th>
                <th>ML Prediction</th>
                <th>Confidence</th>
            </tr>
        </thead>
        <tbody id="alert-table-body">
            <tr><td colspan="7" style="text-align: center;">Loading data from ML Engine...</td></tr>
        </tbody>
    </table>
</div>

<script>
    function fetchAlerts() {
        fetch('/api/alerts')
            .then(response => response.json())
            .then(data => {
                document.getElementById('last-updated').innerText = data.last_updated;
                const tbody = document.getElementById('alert-table-body');
                tbody.innerHTML = '';
                
                if(data.alerts.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">No flows/alerts found in eve.json. Try running a curl request.</td></tr>';
                    return;
                }

                // Reverse array to show newest at the top
                const recentAlerts = data.alerts.reverse();

                recentAlerts.forEach(alert => {
                    const row = document.createElement('tr');
                    const predClass = alert.prediction === 'Attack' ? 'attack' : 'normal';
                    row.className = predClass;
                    row.innerHTML = `
                        <td>${alert.timestamp}</td>
                        <td>${alert.src_ip}</td>
                        <td>${alert.dest_ip}</td>
                        <td>${alert.dest_port}</td>
                        <td>${alert.alert_sig}</td>
                        <td>${alert.prediction}</td>
                        <td>${alert.confidence}%</td>
                    `;
                    tbody.appendChild(row);
                });
            })
            .catch(err => console.error("Failed to fetch alerts:", err));
    }

    // Refresh every 5 seconds
    setInterval(fetchAlerts, 5000);
    fetchAlerts(); // Initial call
</script>

</body>
</html>
